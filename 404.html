<style>
  .error-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    position: relative;
  }

  .error-code {
    font-family: 'Press Start 2P', monospace;
    font-size: 120px;
    line-height: 1;
    color: var(--accent);
    text-shadow:
      0 0 20px rgba(255,140,0,0.6),
      0 0 40px rgba(255,140,0,0.3),
      6px 6px 0 rgba(255,140,0,0.15);
    margin-bottom: 20px;
    animation: error-glitch 3s infinite;
  }

  @keyframes error-glitch {
    0%, 90%, 100% { transform: translate(0, 0); }
    92% { transform: translate(-3px, 2px); }
    94% { transform: translate(3px, -2px); }
    96% { transform: translate(-2px, -2px); }
    98% { transform: translate(2px, 2px); }
  }

  .error-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    color: var(--text);
    margin-bottom: 16px;
    line-height: 1.6;
  }

  .error-title span { color: var(--accent-2); }

  .error-text {
    color: var(--text-dim);
    font-size: 16px;
    max-width: 500px;
    margin-bottom: 36px;
    line-height: 1.7;
  }

  .error-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .error-buttons .btn {
    padding: 14px 30px;
    background: linear-gradient(135deg, var(--accent), #ffaa00);
    color: #14161f;
    font-weight: 700;
    border-radius: 10px;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(255,140,0,0.3);
    font-size: 14px;
    transition: 0.25s;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }

  .error-buttons .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(255,140,0,0.5);
  }

  .error-buttons .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: none;
  }

  .error-buttons .btn-ghost:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: none;
  }

  .error-emoji {
    font-size: 60px;
    margin-bottom: 20px;
    animation: error-float 3s ease-in-out infinite;
  }

  @keyframes error-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @media (max-width: 800px) {
    .error-code { font-size: 70px; }
    .error-title { font-size: 14px; }
    .error-emoji { font-size: 44px; }
  }
</style>
